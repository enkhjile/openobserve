# Builds and publishes this fork's image for every pushed v* tag; see FORK.md.
name: Fork release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      # The server's build script reads the version from this tag.
      - uses: actions/checkout@v7
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/build/Dockerfile -t "$image:$GITHUB_REF_NAME" -t "$image:latest" .
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
          echo "Published $image:$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
