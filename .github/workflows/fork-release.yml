# Builds and publishes this fork's image for every pushed v* tag; see FORK.md.
name: Fork release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build again
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      # The release build outgrows the runner's 16 GB of memory; swap gives it headroom.
      - name: Add swap
        run: |
          dir=/mnt; mountpoint -q /mnt || dir=/
          sudo fallocate -l 24G "$dir/fork-swap"
          sudo chmod 600 "$dir/fork-swap"
          sudo mkswap "$dir/fork-swap"
          sudo swapon "$dir/fork-swap"
          free -h; df -h / /mnt || true
      # The server's build script reads the version from this tag.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      # The runner died three times compiling the openobserve crate; fewer jobs and
      # smaller codegen units lower the compiler's peak memory.
      - name: Lower compile memory
        run: printf '\n[build]\njobs = 2\n\n[profile.release]\ncodegen-units = 16\n' >> .cargo/config.toml
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Logged live so the cause shows even if the runner itself is terminated.
          while sleep 60; do echo "memory: $(free -m | awk 'NR>1 {printf "%s used=%sM ", $1, $3}')top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s=%dM ", $2, $1/1024}')"; done &
          docker build -f deploy/build/Dockerfile -t "$image:$TAG" -t "$image:latest" .
          docker push "$image:$TAG"
          docker push "$image:latest"
          echo "Published $image:$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Show out-of-memory kills
        if: failure()
        run: sudo dmesg -T | grep -iE "out of memory|killed process|oom" | tail -20 || true
