# Fork-only CI on GitHub-hosted runners; upstream workflows need Ubicloud/EKS runners and stay disabled here.
name: Fork CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COLUMNS: 150
  # Same as upstream CI: test builds without debuginfo fit the hosted runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # The hosted image ships ~14 GB free; the workspace build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5

      - uses: ./.github/actions/github-auth

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-24
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install protoc and libclang
        run: |
          bash ./.github/protoc.sh
          sudo apt-get update && sudo apt-get install -y libclang-dev

      # The server embeds web/dist at compile time.
      - run: mkdir -p web/dist && touch web/dist/index.html

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -W clippy::too_many_lines -W clippy::cognitive_complexity -W clippy::excessive_nesting -D warnings

      - name: OIDC tests
        run: |
          cargo test -p openobserve-oidc
          cargo test -p openobserve-core --test oidc_lifecycle
          cargo test -p config -p openobserve-api-common -p openobserve-api-http -p openobserve-core --lib oidc

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint:ci

      - name: Unit tests
        env:
          NODE_OPTIONS: "--no-experimental-webstorage"
        run: >-
          npm run test:unit -- --run components/login/ views/OidcCallback.spec.ts services/oidc.spec.ts
          services/users.spec.ts utils/auth.spec.ts utils/drafts/ utils/sessionServices
          composables/shared/router.spec.ts router/index.spec.ts layouts/

      - name: Browser spec
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite.log 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:4173/web/; do sleep 2; done' || { cat /tmp/vite.log; exit 1; }
          npx cypress run --e2e --spec cypress/e2e/oidc.cy.js --config baseUrl=http://127.0.0.1:4173,supportFile=false
