# Fork-only CI on GitHub-hosted runners; upstream workflows need Ubicloud/EKS runners and stay disabled here.
name: Fork CI

on:
  pull_request:
  # PRs restore caches only from their own branch or main, so main must save them.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COLUMNS: 150
  # Same as upstream CI: test builds without debuginfo fit the hosted runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # The hosted image ships ~14 GB free; the workspace build needs more.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      # github-auth sets its own header; checkout v6+ keeps its copy outside .git/config, where github-auth cannot remove it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-auth
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-10-24
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
      # .github/protoc.sh needs `uname -p`, which hosted runners leave unknown; noble ships the same 3.21.12.
      - name: Install protoc and libclang
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libclang-dev
      # The server embeds web/dist at compile time.
      - run: mkdir -p web/dist && touch web/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -W clippy::too_many_lines -W clippy::cognitive_complexity -W clippy::excessive_nesting -D warnings

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ZO_INTERNAL_GRPC_TOKEN: fake
      ZO_TEXT_DATA_TYPE: text
      ZO_META_STORE: sqlite
      ZO_META_POSTGRES_DSN: ""
      COVERAGE_NO_REPORT: "true"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-auth
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-10-24
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
      - name: Install protoc and libclang
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libclang-dev
      - run: mkdir -p web/dist && touch web/dist/index.html
      # Upstream's own test entry point: nextest over the whole workspace, one database per slot.
      - run: ./coverage.sh run-cov
        env:
          ZO_DATA_DIR: ${{ runner.temp }}/openobserve-sqlite/

  web-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CYPRESS_INSTALL_BINARY: 0
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:ci

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CYPRESS_INSTALL_BINARY: 0
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Specs here stub the backend, so a Vite dev server is all they need.
      - name: Cypress specs
        run: |
          shopt -s nullglob
          specs=(cypress/e2e/*.cy.js cypress/e2e/*.cy.ts)
          [ "${#specs[@]}" -gt 0 ] || { echo "No Cypress specs."; exit 0; }
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:4173/web/; do sleep 2; done' || { cat "$RUNNER_TEMP/vite.log"; exit 1; }
          npx cypress run --e2e --spec "$(IFS=,; echo "${specs[*]}")" --config baseUrl=http://127.0.0.1:4173,supportFile=false
