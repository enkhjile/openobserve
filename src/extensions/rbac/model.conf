[request_definition]
r = sub, dom, kind, stream_type, name, act
[policy_definition]
p = role, dom, kind, stream_type, name, act
[role_definition]
g = _, _, _
[policy_effect]
e = some(where (p.eft == allow))
[matchers]
m = g(r.sub, p.role, r.dom) && r.dom == p.dom && (p.kind == "*" || r.kind == p.kind) && (p.stream_type == "*" || r.stream_type == p.stream_type) && (p.name == "*" || r.name == p.name) && r.act == p.act
